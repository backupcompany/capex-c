name: Deploy CAPEX Web

on:
  push:
    branches:
      - main
    paths:
      - 'capex-apps/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: capex-apps
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: capex-apps/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency audit (report)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Middleware security audit
        run: npm run verify:middleware

      - name: Secure production build gate
        env:
          NEXT_PUBLIC_CAPEXBE_URL: https://example.com
          NEXT_PUBLIC_USE_BACKEND_SESSION: 'true'
          NEXT_PUBLIC_ALLOW_SUPABASE_FALLBACK: 'false'
        run: npm run build:secure

  deploy:
    name: Build, push, deploy
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: capex-apps
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/capex-web:latest
            ghcr.io/${{ github.repository_owner }}/capex-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CAPEXBE_URL=${{ secrets.NEXT_PUBLIC_CAPEXBE_URL || 'http://capex-api:3001' }}
            NEXT_PUBLIC_USE_BACKEND_SESSION=true
            NEXT_PUBLIC_ALLOW_SUPABASE_FALLBACK=false
            NEXT_PUBLIC_CAPEX_AUTH_MODE=${{ secrets.CAPEX_AUTH_MODE || 'sso' }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"

            if [ -z "$APP_DIR" ]; then
              echo "DEPLOY_PATH secret is missing."
              exit 1
            fi

            if [ -z "$GHCR_USERNAME" ]; then
              GHCR_USERNAME="${{ github.actor }}"
            fi

            if [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR_TOKEN is missing."
              exit 1
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            cd "$APP_DIR"

            if [ ! -f docker-compose.yml ] && [ ! -f compose.yml ]; then
              echo "docker compose file not found in $APP_DIR"
              exit 1
            fi

            docker compose pull capex-web
            docker compose up -d --force-recreate --no-deps capex-web

            echo "Waiting for capex-web to boot..."
            sleep 10

            if ! docker ps --format "{{.Names}} {{.Status}}" | grep "capex-web" | grep -q "Up"; then
              echo "capex-web is not running."
              docker logs --tail=150 capex-web || true
              exit 1
            fi

            curl -fsS http://127.0.0.1:8080/ >/dev/null || {
              echo "capex-web smoke test failed."
              docker logs --tail=150 capex-web || true
              exit 1
            }

            echo "CAPEX Web deployed successfully."

            docker image prune -f || true
