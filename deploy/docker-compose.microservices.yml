      CAPEX_SERVICE_FS_URL: http://capex-fs:3011
      CAPEX_SERVICE_MONITORING_URL: http://capex-monitoring:3012
      CAPEX_SERVICE_REPORTING_URL: http://capex-reporting:3013
      CAPEX_SERVICE_EXECUTIVE_SUMMARY_URL: http://capex-executive-summary:3014
      CAPEX_SERVICE_TASKS_URL: http://capex-tasks:3015
      CAPEX_SERVICE_CORE_URL: http://capex-core:3016
      CAPEX_SERVICE_SMART_MIGRATION_URL: http://capex-smart-migration:3017
      CAPEX_SERVICE_AUTH_URL: http://capex-auth:3018
