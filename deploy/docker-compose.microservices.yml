  capex-reporting:
    build: { <<: *leaf-build, args: { SERVICE: capex-reporting, PORT: 3013 } }
    container_name: capex-reporting
    restart: unless-stopped
    ports: ["127.0.0.1:3013:3013"]
    environment: { <<: *leaf-env, PORT: 3013 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3013/health"] }

  capex-executive-summary:
    build: { <<: *leaf-build, args: { SERVICE: capex-executive-summary, PORT: 3014 } }
    container_name: capex-executive-summary
    restart: unless-stopped
    ports: ["127.0.0.1:3014:3014"]
    environment: { <<: *leaf-env, PORT: 3014 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3014/health"] }

  capex-tasks:
    build: { <<: *leaf-build, args: { SERVICE: capex-tasks, PORT: 3015 } }
    container_name: capex-tasks
    restart: unless-stopped
    ports: ["127.0.0.1:3015:3015"]
