  capex-procurement:
    build: { <<: *leaf-build, args: { SERVICE: capex-procurement, PORT: 3010 } }
    container_name: capex-procurement
    restart: unless-stopped
    ports: ["127.0.0.1:3010:3010"]
    environment: { <<: *leaf-env, PORT: 3010 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/health"] }

  capex-fs:
    build: { <<: *leaf-build, args: { SERVICE: capex-fs, PORT: 3011 } }
    container_name: capex-fs
    restart: unless-stopped
    ports: ["127.0.0.1:3011:3011"]
    environment: { <<: *leaf-env, PORT: 3011 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3011/health"] }

  capex-monitoring:
    build: { <<: *leaf-build, args: { SERVICE: capex-monitoring, PORT: 3012 } }
    container_name: capex-monitoring
    restart: unless-stopped
