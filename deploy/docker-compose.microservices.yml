    environment: { <<: *leaf-env, PORT: 3017 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3017/health"] }

  capex-auth:
    build: { <<: *leaf-build, args: { SERVICE: capex-auth, PORT: 3018 } }
    container_name: capex-auth
    restart: unless-stopped
    ports: ["127.0.0.1:3018:3018"]
    environment:
      <<: *leaf-env
      PORT: 3018
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3018/health"] }

  capex-web:
    build:
      context: ../capex-apps
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CAPEXBE_URL: http://capex-api:3001
        NEXT_PUBLIC_USE_BACKEND_SESSION: "true"
        NEXT_PUBLIC_ALLOW_SUPABASE_FALLBACK: "false"
    container_name: capex-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      NEXT_PUBLIC_CAPEXBE_URL: http://capex-api:3001
      NEXT_PUBLIC_USE_BACKEND_SESSION: "true"
      NEXT_PUBLIC_ALLOW_SUPABASE_FALLBACK: "false"
      CAPEX_SERVICE_NOTIFICATIONS_URL: http://capex-notifications:3002
      CAPEX_SERVICE_AUDIT_URL: http://capex-audit:3003
      CAPEX_SERVICE_BACKUP_URL: http://capex-backup:3004
      CAPEX_SERVICE_CONFIGURATION_URL: http://capex-config:3005
      CAPEX_SERVICE_MOM_DAILY_SUMMARY_URL: http://capex-mom-daily-summary:3006
      CAPEX_SERVICE_ASSET_TIMELINE_URL: http://capex-asset-timeline:3007
      CAPEX_SERVICE_DUPLICATE_DETECTION_URL: http://capex-duplicate-detection:3008
