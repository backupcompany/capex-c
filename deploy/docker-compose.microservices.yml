    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3016/health"] }

  capex-smart-migration:
    build: { <<: *leaf-build, args: { SERVICE: capex-smart-migration, PORT: 3017 } }
    container_name: capex-smart-migration
    restart: unless-stopped
