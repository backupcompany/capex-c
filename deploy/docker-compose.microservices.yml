name: capex-microservices

x-supabase-env: &supabase-env
  SUPABASE_URL: ${SUPABASE_URL:?set in deploy/.env.compose}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}

x-leaf-env: &leaf-env
  <<: *supabase-env
  NODE_ENV: production
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

x-leaf-health: &leaf-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  redis:
    image: redis:7-alpine
    container_name: capex-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  capex-api:
    build:
      context: ../capexbe
      dockerfile: Dockerfile
    container_name: capex-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      <<: *supabase-env
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *leaf-health
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]

  capex-notifications:
    build: &leaf-build
      context: ..
      dockerfile: services/Dockerfile.leaf
      args: { SERVICE: capex-notifications, PORT: 3002 }
    container_name: capex-notifications
    restart: unless-stopped
    ports: ["127.0.0.1:3002:3002"]
    environment: { <<: *leaf-env, PORT: 3002 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"] }

  capex-audit:
    build: { <<: *leaf-build, args: { SERVICE: capex-audit, PORT: 3003 } }
    container_name: capex-audit
    restart: unless-stopped
    ports: ["127.0.0.1:3003:3003"]
    environment: { <<: *leaf-env, PORT: 3003 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"] }

  capex-backup:
    build: { <<: *leaf-build, args: { SERVICE: capex-backup, PORT: 3004 } }
    container_name: capex-backup
    restart: unless-stopped
    ports: ["127.0.0.1:3004:3004"]
    environment: { <<: *leaf-env, PORT: 3004 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"] }

  capex-config:
    build: { <<: *leaf-build, args: { SERVICE: capex-config, PORT: 3005 } }
    container_name: capex-config
    restart: unless-stopped
    ports: ["127.0.0.1:3005:3005"]
    environment: { <<: *leaf-env, PORT: 3005 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health"] }

  capex-mom-daily-summary:
    build: { <<: *leaf-build, args: { SERVICE: capex-mom-daily-summary, PORT: 3006 } }
    container_name: capex-mom-daily-summary
    restart: unless-stopped
    ports: ["127.0.0.1:3006:3006"]
    environment: { <<: *leaf-env, PORT: 3006 }
    healthcheck: { <<: *leaf-health, test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/health"] }

  capex-asset-timeline:
    build: { <<: *leaf-build, args: { SERVICE: capex-asset-timeline, PORT: 3007 } }
    container_name: capex-asset-timeline
