# CAPEX local Postgres + PostgREST (Siloam VM / self-hosted).
# No Tencent tunnel. Runtime: capex-api → capex-postgrest → capex-postgres
#
# On VM:
#   cd /opt/capex-deploy
#   docker compose -f docker-compose.db.yml --env-file .env up -d
#   # then restore: ./postgres/restore-dump-on-vm.sh /path/to/capex.dump
#
# Host debug ports (localhost only):
#   Postgres  127.0.0.1:5433
#   PostgREST 127.0.0.1:54321  (supabase-js base URL shape: /rest/v1/)
#
# Inside Docker network `capex-db`, API must use:
#   SUPABASE_URL=http://capex-postgrest
# NOT http://127.0.0.1:54321 (that is the API container itself).

name: capex-db

services:
  capex-postgres:
    image: ${CAPEX_POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: capex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capex}
      POSTGRES_USER: ${POSTGRES_USER:-capex_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - capex_pg_data:/var/lib/postgresql/data
      - ./postgres/vm-bootstrap/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    networks:
      - capex-db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-capex_app} -d ${POSTGRES_DB:-capex}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Internal PostgREST (not published). Gateway below rewrites /rest/v1/ for supabase-js.
  capex-postgrest-engine:
    image: ${CAPEX_POSTGREST_IMAGE:-postgrest/postgrest:v12.2.3}
    container_name: capex-postgrest-engine
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://${POSTGRES_USER:-capex_app}:${POSTGRES_PASSWORD}@capex-postgres:5432/${POSTGRES_DB:-capex}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-capex_app}
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set SUPABASE_JWT_SECRET in .env}
      PGRST_DB_MAX_ROWS: "50000"
    depends_on:
      capex-postgres:
        condition: service_healthy
    networks:
      capex-db:
        aliases:
          - postgrest

  # Published as capex-postgrest — this is SUPABASE_URL for containers on capex-db.
  capex-postgrest:
    image: nginx:1.27-alpine
    container_name: capex-postgrest
    restart: unless-stopped
    ports:
      - "127.0.0.1:54321:80"
    volumes:
      - ./postgres/postgrest-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - capex-postgrest-engine
    networks:
      - capex-db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/auth/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  capex_pg_data:

networks:
  capex-db:
    name: capex-db
