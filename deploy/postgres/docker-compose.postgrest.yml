# Local PostgREST → host Postgres (SSH tunnel on host :5433) — laptop only.
# Siloam VM: use ../docker-compose.db.yml instead (no Tencent tunnel).
# Usage: make postgrest-up   (requires DATABASE_URL / tunnel)
services:
  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI:-${DATABASE_URL}}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: capex_app
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_MAX_ROWS: "50000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - postgrest

  postgrest-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "54321:80"
    volumes:
      - ./postgrest-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgrest
