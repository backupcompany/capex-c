# Production / Siloam DEV — CI/CD deploys 2 GHCR images (monolith capex-api + capex-web BFF).
# Monorepo: images built from capexbe/ + capex-apps/ (not separate repos).
# On VM: copy to /opt/capex-deploy/docker-compose.yml
# Env: deploy/.env.vps.example → /opt/capex-deploy/.env (secrets — never commit)
#
# Local DB stack (no Tencent tunnel):
#   docker compose -f docker-compose.db.yml --env-file .env up -d
#   → network `capex-db`, services capex-postgres + capex-postgrest
# API must use SUPABASE_URL=http://capex-postgrest (Docker DNS), never 127.0.0.1:54321.
#
# Caddy (gateway, host network) — see deploy/caddy/Caddyfile.capex:
#   capex.cgp-ai.com     → 127.0.0.1:8080  (capex-web)
#   capex-api.cgp-ai.com → 127.0.0.1:8082  (capex-api)

name: capex-production

services:
  capex-api:
    image: ${CAPEX_API_IMAGE:-ghcr.io/backupcompany/capex-api:latest}
    container_name: capex-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8082
      # Prefer compose DB network; override in .env if needed.
      USE_VPS_POSTGRES: ${USE_VPS_POSTGRES:-1}
      SUPABASE_URL: ${SUPABASE_URL:-http://capex-postgrest}
    networks:
      - default
      - capex-db
      - redis-net
    healthcheck:
      # node:alpine has no wget/curl — use fetch (Node 22)
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  capex-web:
    image: ${CAPEX_WEB_IMAGE:-ghcr.io/backupcompany/capex-web:latest}
    container_name: capex-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
    networks:
      - default
    depends_on:
      capex-api:
        condition: service_healthy

networks:
  # Created by: docker compose -f docker-compose.db.yml up -d
  capex-db:
    external: true
    name: capex-db
  # Shared Redis — set COMPOSE_REDIS_NETWORK if name differs on Siloam
  redis-net:
    name: ${COMPOSE_REDIS_NETWORK:-capex-redis_default}
    external: true
