# Production / Siloam — pull GHCR images (CI) OR build locally via docker-compose.siloam.yml
#
# Prefer one-shot on VM:
#   docker compose -f deploy/docker-compose.siloam.yml --env-file deploy/.env.compose up -d --build
#
# This file: image-only deploy when GHCR already has builds.
# API listens on 3001 inside the container (matches Dockerfile). Host maps 8082→3001.
# Web BFF must use SUPABASE/API URL: http://capex-api:3001 (not 127.0.0.1).

name: capex-production

services:
  capex-api:
    image: ${CAPEX_API_IMAGE:-ghcr.io/backupcompany/capex-api:latest}
    container_name: capex-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      USE_VPS_POSTGRES: ${USE_VPS_POSTGRES:-1}
      SUPABASE_URL: ${SUPABASE_URL:-http://capex-postgrest}
    networks:
      - default
      - capex-db
      - redis-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  capex-web:
    image: ${CAPEX_WEB_IMAGE:-ghcr.io/backupcompany/capex-web:latest}
    container_name: capex-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      CAPEXBE_URL: ${CAPEXBE_URL:-http://capex-api:3001}
      NEXT_PUBLIC_CAPEXBE_URL: ${NEXT_PUBLIC_CAPEXBE_URL:-http://capex-api:3001}
    networks:
      - default
      - capex-db
    depends_on:
      capex-api:
        condition: service_healthy

networks:
  capex-db:
    external: true
    name: capex-db
  redis-net:
    name: ${COMPOSE_REDIS_NETWORK:-capex-redis_default}
    external: true
