# Production VM — CI/CD deploys 2 GHCR images (monolith capex-api + capex-web BFF).
# Monorepo: images built from capexbe/ + capex-apps/ (not separate repos).
# On VM: copy to /opt/capex-deploy/docker-compose.yml
# Env: deploy/.env.vps.example → /opt/capex-deploy/.env (secrets — never commit)
#
# Caddy (gateway, host network) — see deploy/caddy/Caddyfile.capex:
#   capex.cgp-ai.com     → 127.0.0.1:8080  (capex-web)
#   capex-api.cgp-ai.com → 127.0.0.1:8082  (capex-api)

name: capex-production

services:
  capex-api:
    image: ${CAPEX_API_IMAGE:-ghcr.io/backupcompany/capex-api:latest}
    container_name: capex-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8082
    networks:
      - default
      - database-net
      - redis-net
    healthcheck:
      # node:alpine has no wget/curl — use fetch (Node 22)
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  capex-web:
    image: ${CAPEX_WEB_IMAGE:-ghcr.io/backupcompany/capex-web:latest}
    container_name: capex-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
    networks:
      - default
    depends_on:
      capex-api:
        condition: service_healthy

networks:
  database-net:
    external: true
  # Shared Redis (cgp-redis on cgp-cgolangp_default)
  redis-net:
    name: ${COMPOSE_REDIS_NETWORK:-cgp-cgolangp_default}
    external: true
